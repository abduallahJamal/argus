<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="argus — Hundred Eyes, Zero MCP: Static-Analysis Router CLI &amp; Multi-Agent Reverse-Engineering Skill">
